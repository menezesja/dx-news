<div class="page-wrapper">
    <mat-card class="signup-container"> 
        <img src="assets/logo-login.png" alt="register" class="logo">
        <form [formGroup]="form" (ngSubmit)="onRegister()" class="register-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>User</mat-label>
                <input matInput type="text" formControlName="username" placeholder="Ex. fulano.silva" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" placeholder="pat@example.com" />
                <mat-error *ngIf="errorMessage()">{{ errorMessage() }}</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" />
                <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility('password', $event)">
                <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="passwordError()">{{ passwordError() }}</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Confirm Password</mat-label>
                <input matInput [type]="hideConfirmPassword() ? 'password' : 'text'" formControlName="confirmPassword" />
                <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility('confirm', $event)">
                    <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>

            <button mat-flat-button type="submit" class="submit-register">Register</button> 

            <!-- LINK PARA LOGIN -->
            <a href="/login" class="login-link">Already registered? Log in</a>
        </form>
    </mat-card>

    <footer>
        <div class="footer-content">
            <img src="assets/logo-lgelectronics.png" alt="LG Electronics Logo" class="footer-logo">
            <img src="assets/dx_logo.svg" alt="DX Logo" class="footer-logo">
            <span class="footer-text">Copyright ⓒ2025 DX Academy</span>
        </div>
    </footer>
</div>
